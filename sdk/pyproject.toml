[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpinejudge-sdk"
version = "0.1.0"
authors = [
  { name="S.M Sadat", email="smsadat788@gmail.com" },
]
description = "Python SDK for AlpineJudge"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/smsadat1/AlpineJudge"
