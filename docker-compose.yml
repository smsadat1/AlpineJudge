services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ajadmin
      RABBITMQ_DEFAULT_PASS: nimdaja
      RABBITMQ_PLUGINS: rabbitmq_management 
    
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    
    # just in case
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    
    # resource limitations so RMQ doesn't consume entire server resource under pressure
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ajadmin
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/minio/data
    command: server /minio/data --console-address ":9001"


  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
  
    container_name: ajdispatcher
  
    ports:
      - 1111:1111
  
    depends_on: 
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started   
  
    env_file:
      - .env

    # starts dispatcher daemon
    command: ./ajdispatcher


  runner:
    build: 
      context: .
      dockerfile: runner/Dockerfile
    
    container_name: ajrunner
    
    depends_on: 
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started  
  
    env_file:
      - .env

    # for containerd access
    privileged: true  
    volumes:
      - /run/containerd:/run/containerd           # need for containerd client
      - /var/lib/containerd:/var/lib/containerd   # need for runc
      
      # MUST FUCKING mount this
      # Because Runner uses the HOST containerd daemon.
      # Any bind-mount source used for warm containers must therefore exist on the host filesystem and be visible inside Runner.
      # Removing this breaks the Runner <-> ajagent Unix socket handshake.
      - /tmp/runner:/tmp/runner                   
    
    # starts runner daemon
    command: ./ajrunner


volumes:
  rabbitmq_data:
  rabbitmq_log:
  minio_data: