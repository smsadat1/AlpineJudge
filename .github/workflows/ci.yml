name: AlpineJudge Tests

on: 
  push: 
      branches: [main]
      paths-ignore:
       - 'docs/**'
       - 'sdk/**'
  pull_request:
      branches: [main]
      paths-ignore:
       - 'docs/**'
       - 'sdk/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ajagent, shared, dispatcher, runner]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run ajagent Tests
        if: matrix.module == 'ajagent'
        working-directory: ${{ matrix.module }}
        run: |
          cd tests && python generator.py && cd -
          go vet -v ./...
          go test -race -v ./...

      - name: Run shared / dispatcher Tests
        if: matrix.module == 'shared' || matrix.module == 'dispatcher'
        working-directory: ${{ matrix.module }}
        run: |
          go vet -v ./...
          go test -race -v ./...

      - name: Run runner Tests
        if: matrix.module == 'runner'
        working-directory: ${{ matrix.module }}
        run: |
          pip install cryptography
          sudo rm -rf /tmp/rabbitmq-testcontainers*
          sudo systemctl start containerd
          sudo ctr -n test-namespace images pull ghcr.io/smsadat1/alpinejudge/master:test
          sudo ctr -n test-namespace images pull ghcr.io/smsadat1/alpinejudge/master:v0.1.0
          cd tests && python generator1.py && python generator2.py
          sudo go vet -v ./...
          sudo go test -race -v -timeout 30m ./...