name: AlpineJudge Tests

on: 
  push: 
      branches: [main]
      paths-ignore:
       - 'docs/**'
  pull_request:
      branches: [main]
      paths-ignore:
       - 'docs/**'

jobs:
  unit-tests: 
    runs-on: ubuntu-latest 
    strategy:
      fail-fast: false
      matrix:
        module: [ajagent, shared, dispatcher]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
        
      - name: Run ${{ matrix.module }} Tests
        working-directory: ${{ matrix.module }}  
        run : | 
            go vet -v ./...
            go test -race -v ./...

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest 
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          
      - name: Run Runner Tests
        working-directory: runner
        run: | 
          sudo rm -rf /tmp/rabbitmq-testcontainers*
          sudo systemctl start containerd
          sudo ctr -n test-namespace images pull ghcr.io/smsadat1/alpinejudge/master:test
          sudo go vet -v ./...
          sudo go test -race -v ./...