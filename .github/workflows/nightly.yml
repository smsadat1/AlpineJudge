name: Nightly Test

on:
  schedule: 
    - cron: "0 2 * * *"
  # for manual testing
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      
      - name: Create .env
        run: |
          printf '%s\n' '${{ secrets.AJENVVARS2 }}' > .env

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services 
        run: docker compose ps 
      
      - name: Run full system test
        run: | 
          pip install alpinejudge-sdk cryptography
          python tests/e2e/generator1.py && python tests/e2e/generator2.py
          python tests/e2e/fulltest.py